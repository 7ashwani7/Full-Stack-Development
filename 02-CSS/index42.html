<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bootstrap Utilities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div id="slider" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">

                <img src="https://picsum.photos/1200/400?1" class="d-block w-100">

            </div>

            <div class="carousel-item">

                <img src="https://picsum.photos/1200/400?2" class="d-block w-100">

            </div>

            <div class="carousel-item">

                <img src="https://picsum.photos/1200/400?3" class="d-block w-100">

            </div>

        </div>

        <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>F
