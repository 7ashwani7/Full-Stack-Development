<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <link rel="stylesheet" href="style14.css">
</head>

<body>

    <h1>CSS Transform Demo</h1>

    <h2>Translate</h2>

    <div class="box translate">
        Translate
    </div>

    <hr>

    <h2>Rotate</h2>

    <div class="box rotate">
        Rotate
    </div>

    <hr>

    <h2>Scale</h2>

    <div class="box scale">
        Scale
    </div>

    <hr>

    <h2>Scale X</h2>

    <div class="box scale-x">
        ScaleX
    </div>

    <hr>

    <h2>Scale Y</h2>

    <div class="box scale-y">
        ScaleY
    </div>

    <hr>

    <h2>Skew</h2>

    <div class="box skew">
        Skew
    </div>

    <hr>

    <h2>Transform Origin</h2>

    <div class="box origin">
        Origin
    </div>

    <hr>

    <h2>Multiple Transform</h2>

    <div class="box multiple">
        Multiple
    </div>

</body>

</html>
