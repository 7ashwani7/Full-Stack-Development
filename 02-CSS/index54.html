<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Icons</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center mb-5">

            Bootstrap Icons Examples

        </h1>


        <h3>1. Basic Icons</h3>

        <i class="bi bi-house-fill fs-2"></i>

        <i class="bi bi-person-fill fs-2 ms-3"></i>

        <i class="bi bi-envelope-fill fs-2 ms-3"></i>

        <i class="bi bi-telephone-fill fs-2 ms-3"></i>

        <i class="bi bi-gear-fill fs-2 ms-3"></i>

        <hr>


        <h3>2. Buttons with Icons</h3>

        <button class="btn btn-primary">

            <i class="bi bi-download"></i>

            Download

        </button>

        <button class="btn btn-success ms-2">

            <i class="bi bi-check-circle-fill"></i>

            Save

        </button>

        <button class="btn btn-danger ms-2">

            <i class="bi bi-trash-fill"></i>

            Delete

        </button>

        <hr>


        <h3>3. Navbar Icons</h3>

        <nav class="navbar bg-dark navbar-dark rounded px-3">

            <a class="navbar-brand" href="#">

                <i class="bi bi-bootstrap-fill"></i>

                My Website

            </a>

            <div>

                <i class="bi bi-search text-white me-3"></i>

                <i class="bi bi-heart-fill text-danger me-3"></i>

                <i class="bi bi-cart-fill text-warning me-3"></i>

                <i class="bi bi-person-circle text-info"></i>

            </div>

        </nav>

        <hr>


        <h3>4. Feature Cards</h3>

        <div class="row">

            <div class="col-md-4 mb-3">

                <div class="card text-center">

                    <div class="card-body">

                        <i class="bi bi-shield-check text-success fs-1"></i>

                        <h5 class="mt-3">

                            Secure

                        </h5>

                        <p>

                            Your data is protected.

                        </p>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="card text-center">

                    <div class="card-body">

                        <i class="bi bi-lightning-charge-fill text-warning fs-1"></i>

                        <h5 class="mt-3">

                            Fast

                        </h5>

                        <p>

                            Lightning-fast performance.

                        </p>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="card text-center">

                    <div class="card-body">

                        <i class="bi bi-globe2 text-primary fs-1"></i>

                        <h5 class="mt-3">

                            Global

                        </h5>

                        <p>

                            Available worldwide.

                        </p>

                    </div>

                </div>

            </div>

        </div>

        <hr>

        <h3>5. Login Form</h3>

        <div class="mb-3">

            <label class="form-label">

                <i class="bi bi-envelope-fill"></i>

                Email

            </label>

            <input type="email" class="form-control" placeholder="Enter email">

        </div>

        <div class="mb-3">

            <label class="form-label">

                <i class="bi bi-lock-fill"></i>

                Password

            </label>

            <input type="password" class="form-control" placeholder="Enter password">

        </div>

        <button class="btn btn-primary">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

        <hr>

        <h3>6. Social Media</h3>

        <i class="bi bi-facebook fs-2 text-primary"></i>

        <i class="bi bi-instagram fs-2 text-danger ms-3"></i>

        <i class="bi bi-twitter-x fs-2 ms-3"></i>

        <i class="bi bi-linkedin fs-2 text-info ms-3"></i>

        <i class="bi bi-youtube fs-2 text-danger ms-3"></i>

    </div>

</body>

</html>
