<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Properties</title>
    <link rel="stylesheet" href="style4.css">
</head>

<body>
    <h1>CSS Background Properties</h1>

    <div class="color-box">
        Background Color
    </div>

    <div class="image-box">
        Background Image
    </div>

    <div class="cover-box">
        Background Cover
    </div>

    <div class="contain-box">
        Background Contain
    </div>

    <div class="fixed-box">
        Background Fixed
    </div>

    <div class="origin-box">
        Background Origin
    </div>

    <div class="clip-box">
        Background Clip
    </div>

    <div class="linear-box">
        Linear Gradient
    </div>

    <div class="radial-box">
        Radial Gradient
    </div>

    <div class="shorthand-box">
        Background Shorthand
    </div>

</body>

</html>
