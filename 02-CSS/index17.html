<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Units</title>

    <link rel="stylesheet" href="style17.css">

</head>

<body>

    <h1>CSS Units Demo</h1>

    <div class="px-box">300px Width</div>

    <div class="parent">

        <div class="percent-box">50%</div>

    </div>

    <div class="em-parent">

        Parent Text

        <p class="em-text">2em Text</p>

    </div>

    <p class="rem-text">2rem Text</p>

    <div class="vw-box">50vw</div>

    <div class="vh-box">

        50vh Height

    </div>

    <input type="text" placeholder="40ch Input" class="input-box">

</body>

</html>
