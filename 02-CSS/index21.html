<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Combinators</title>

    <link rel="stylesheet" href="style21.css">

</head>

<body>

    <div class="container">

        <h2>Main Heading</h2>

        <p>Paragraph One</p>

        <section>

            <p>Paragraph Two</p>

        </section>

        <h3>Sub Heading</h3>

        <p>Paragraph Three</p>

        <span>Span Element</span>

        <p>Paragraph Four</p>

    </div>

</body>

</html>
