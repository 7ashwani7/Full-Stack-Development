<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Part 1</title>
    <link rel="stylesheet" href="style11.css">
</head>

<body>

    <h1>CSS Grid - Grid Container</h1>

    <div class="grid-container">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>

    </div>

    <hr>

    <h2>Different Column Sizes</h2>

    <div class="grid-container columns">

        <div class="item">1fr</div>
        <div class="item">2fr</div>
        <div class="item">1fr</div>

    </div>

    <hr>

    <h2>Place Items Center</h2>

    <div class="grid-container center-grid">

        <div class="item small">A</div>
        <div class="item small">B</div>
        <div class="item small">C</div>
        <div class="item small">D</div>

    </div>

</body>

</html>
