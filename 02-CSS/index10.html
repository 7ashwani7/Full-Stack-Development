<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Part 2</title>
    <link rel="stylesheet" href="style10.css">
</head>

<body>

    <h1>Flex Item Properties</h1>

    <h2>Order</h2>

    <div class="container order-demo">

        <div class="item order1">1</div>
        <div class="item order2">2</div>
        <div class="item order3">3</div>

    </div>

    <h2>Flex Grow</h2>

    <div class="container">

        <div class="item grow1">1</div>
        <div class="item grow2">2</div>
        <div class="item grow3">3</div>

    </div>

    <h2>Flex Shrink</h2>

    <div class="container shrink-demo">

        <div class="item shrink1">A</div>
        <div class="item shrink2">B</div>
        <div class="item shrink3">C</div>

    </div>

    <h2>Flex Basis</h2>

    <div class="container">

        <div class="item basis1">200px</div>
        <div class="item">Auto</div>
        <div class="item">Auto</div>

    </div>

    <h2>Align Self</h2>

    <div class="container align-demo">

        <div class="item">1</div>

        <div class="item self">2</div>

        <div class="item">3</div>

    </div>

</body>

</html>
