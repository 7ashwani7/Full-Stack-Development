<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>
    <link rel="stylesheet" href="style13.css">
</head>

<body>

    <h1>CSS Transition Demo</h1>

    <h2>1. Background Transition</h2>

    <button class="btn bg-btn">
        Hover Me
    </button>

    <hr>

    <h2>2. Width Transition</h2>

    <div class="box width-box"></div>

    <hr>

    <h2>3. Multiple Transition</h2>

    <div class="box multi-box"></div>

    <hr>

    <h2>4. Delay Example</h2>

    <div class="box delay-box"></div>

    <hr>

    <h2>5. Timing Function</h2>

    <div class="timing-container">

        <div class="timing linear">Linear</div>

        <div class="timing ease">Ease</div>

        <div class="timing ease-in">Ease In</div>

        <div class="timing ease-out">Ease Out</div>

        <div class="timing ease-in-out">Ease In Out</div>

    </div>

</body>

</html>
