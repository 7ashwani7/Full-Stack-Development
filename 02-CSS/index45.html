<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Progress Bars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center mb-5">

            Bootstrap Progress Bars

        </h1>


        <h4>Basic Progress</h4>

        <div class="progress mb-4">

            <div class="progress-bar" style="width:40%;">

                40%

            </div>

        </div>


        <h4>Colored Progress Bars</h4>

        <div class="progress mb-3">

            <div class="progress-bar bg-success" style="width:75%;">

                Success

            </div>

        </div>

        <div class="progress mb-3">

            <div class="progress-bar bg-danger" style="width:30%;">

                Danger

            </div>

        </div>

        <div class="progress mb-3">

            <div class="progress-bar bg-warning text-dark" style="width:60%;">

                Warning

            </div>

        </div>


        <h4>Striped Progress</h4>

        <div class="progress mb-4">

            <div class="progress-bar progress-bar-striped bg-info" style="width:70%;">

                70%

            </div>

        </div>


        <h4>Animated Progress</h4>

        <div class="progress mb-4">

            <div class="progress-bar
                    progress-bar-striped
                    progress-bar-animated
                    bg-primary" style="width:80%;">

                Uploading...

            </div>

        </div>


        <h4>Multiple Progress Bars</h4>

        <div class="progress mb-4">

            <div class="progress-bar bg-success" style="width:30%;">

                HTML

            </div>

            <div class="progress-bar bg-primary" style="width:40%;">

                CSS

            </div>

            <div class="progress-bar bg-warning text-dark" style="width:30%;">

                JS

            </div>

        </div>

        <h4>Developer Skills</h4>

        <p>HTML</p>

        <div class="progress mb-3">

            <div class="progress-bar bg-success" style="width:95%;">

                95%

            </div>

        </div>

        <p>CSS</p>

        <div class="progress mb-3">

            <div class="progress-bar bg-info" style="width:90%;">

                90%

            </div>

        </div>

        <p>Bootstrap</p>

        <div class="progress mb-3">

            <div class="progress-bar bg-primary" style="width:85%;">

                85%

            </div>

        </div>

        <p>JavaScript</p>

        <div class="progress mb-3">

            <div class="progress-bar bg-warning text-dark" style="width:70%;">

                70%

            </div>

        </div>

        <h4 class="mt-5">

            File Upload

        </h4>

        <div class="progress">

            <div class="progress-bar
                    progress-bar-striped
                    progress-bar-animated
                    bg-success" style="width:65%;">

                Uploading... 65%

            </div>

        </div>

    </div>

</body>

</html>
