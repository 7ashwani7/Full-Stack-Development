<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Color Properties</title>
</head>
<body>
    <!--style tag-->
    <style>
        h1 {
            color: blue;
        }
        p {
            color: red;
        }
        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>

    <h1>ASHWANI CHAUHAN</h1>
    <h1>HELLO WORLD!</h1>
    <p>This is a paragraph with red text.</p>
    <button>Click Me</button>
    
</body>
</html>
