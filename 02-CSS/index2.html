<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <h1>Element Selector</h1>

    <p class="green">
        Class Selector
    </p>

    <h2 id="heading">
        ID Selector
    </h2>

    <h3>Group Selector</h3>
    <h4>Group Selector</h4>

    <hr>

    <div class="box">

        <p>Descendant Selector</p>

        <section>
            <p>Nested Descendant Selector</p>
        </section>

    </div>

    <hr>

    <div class="parent">

        <p>Direct Child Selector</p>

        <div>
            <p>Not Direct Child</p>
        </div>

    </div>

    <hr>

    <h5>Adjacent Sibling</h5>

    <p>Selected by +</p>

    <p>Not Selected</p>

    <hr>

    <h6>General Sibling</h6>

    <p>Selected by ~</p>

    <p>Selected by ~</p>

    <p>Selected by ~</p>

    <hr>

    <input type="text" placeholder="Text Input">

    <br><br>

    <input type="password" placeholder="Password">

</body>
</html>
