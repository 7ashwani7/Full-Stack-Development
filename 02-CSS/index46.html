<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Spinners</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center mb-5">

            Bootstrap Spinners

        </h1>


        <h3>Border Spinner</h3>

        <div class="spinner-border"></div>

        <hr>


        <h3>Colored Spinners</h3>

        <div class="spinner-border text-primary"></div>

        <div class="spinner-border text-success"></div>

        <div class="spinner-border text-danger"></div>

        <div class="spinner-border text-warning"></div>

        <div class="spinner-border text-info"></div>

        <div class="spinner-border text-dark"></div>

        <hr>


        <h3>Growing Spinner</h3>

        <div class="spinner-grow text-primary"></div>

        <div class="spinner-grow text-success"></div>

        <div class="spinner-grow text-danger"></div>

        <hr>

        <h3>Different Sizes</h3>

        <div class="spinner-border spinner-border-sm"></div>

        <div class="spinner-border"></div>

        <div class="spinner-grow spinner-grow-sm"></div>

        <hr>

        <h3>Loading Buttons</h3>

        <button class="btn btn-primary">

            <span class="spinner-border spinner-border-sm"></span>

            Loading...

        </button>

        <button class="btn btn-success">

            <span class="spinner-grow spinner-grow-sm"></span>

            Saving...

        </button>

        <hr>


        <h3>Centered Spinner</h3>

        <div class="d-flex justify-content-center">

            <div class="spinner-border text-primary"></div>

        </div>

        <hr>


        <div class="card mt-4 shadow">

            <div class="card-body text-center">

                <h4>

                    Loading User Profile

                </h4>

                <div class="spinner-border text-success mt-3"></div>

            </div>

        </div>

        <hr>


        <div class="bg-dark text-white p-5 rounded text-center">

            <h3>

                Please Wait...

            </h3>

            <div class="spinner-grow text-warning mt-3"></div>

        </div>

    </div>

</body>

</html>
