<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists Tags</title>
</head>
<body>

    <!--Lists tags-->
    <h3>Ordered List</h3>

    <ol>
        <li>Apple</li>
        <li>Mango</li>
    </ol>

    <h3>Unordered List</h3>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <h3>Description List</h3>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
    </dl>

    
</body>
</html>
